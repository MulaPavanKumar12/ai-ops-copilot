[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiops-copilot"
version = "1.0.0"
description = "AI-powered monitoring assistant: ML anomaly detection, security detection and LLM root-cause analysis"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<4",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "python-dotenv>=1.0,<2",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
    "httpx>=0.27,<1",
    "prometheus-client>=0.20,<1",
    "scikit-learn>=1.4,<2",
    "joblib>=1.3,<2",
    "torch>=2.2,<3",
    "chromadb>=0.5,<2",
    "anthropic>=2.0,<3",
    "SQLAlchemy>=2.0,<3",
    "psycopg[binary]>=3.1,<4",
    "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "pandas-stubs"]

[project.scripts]
aiops-generate = "aiops_copilot.generator.cli:main"
aiops-simulator = "aiops_copilot.simulator.app:main"
aiops-train = "aiops_copilot.evaluation.run_detection:main"
aiops-build-kb = "aiops_copilot.rag.build:main"
aiops-eval-rca = "aiops_copilot.evaluation.run_rca:main"
aiops-api = "aiops_copilot.api.main:main"
aiops-worker = "aiops_copilot.pipeline.worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Long human-readable root-cause / fix sentences.
"src/aiops_copilot/generator/incidents.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["aiops_copilot"]
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
